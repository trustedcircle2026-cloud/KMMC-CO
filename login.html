<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f4f3">
  <meta name="description" content="Secure portal login for K Mahesh Manickham and Co. Chartered Accountants.">
  <link rel="icon" type="image/png" href="assets/images/CA%20Logo.png">
  <title>Portal Login | K Mahesh Manickham and Co.</title>
  <style>
    :root{--ink:#202326;--muted:#6d7276;--line:#d7d9d9;--paper:#fff;--soft:#f4f5f4;--accent:#17466f;--button:#7b8080}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
    body{min-height:100vh;background:#f5f5f4;display:flex;flex-direction:column}
    .login-shell{flex:1;min-height:calc(100vh - 46px);display:grid;grid-template-columns:minmax(0,1fr) minmax(390px,32%);position:relative;overflow:hidden;background:linear-gradient(132deg,#fff 0%,#fff 44%,#f1f2f1 44.1%,#fafafa 67%,#f2f2f1 100%)}
    .login-shell:before{content:"";position:absolute;inset:0 32% 0 0;pointer-events:none;opacity:.55;background:repeating-linear-gradient(48deg,transparent 0,transparent 28px,rgba(210,212,211,.34) 29px,rgba(210,212,211,.34) 36px)}
    .brand-panel{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:56px 7vw;text-align:center}
    .brand-inner{max-width:620px}
    .brand-logo{width:108px;height:108px;object-fit:contain;margin:0 auto 24px;display:block}
    .brand-name{font-size:clamp(24px,2.3vw,38px);line-height:1.25;font-weight:700;letter-spacing:.01em;margin:0;color:#17191b}
    .brand-subtitle{font-size:13px;letter-spacing:.22em;margin:14px 0 0;color:#555b5f;text-transform:uppercase}
    .brand-rule{height:2px;width:74px;background:#7b8080;margin:24px auto 0}
    .form-panel{position:relative;z-index:1;min-height:calc(100vh - 46px);background:rgba(255,255,255,.76);border-left:1px solid #d8d9d8;display:flex;align-items:center;justify-content:center;padding:42px clamp(24px,3.5vw,58px)}
    .login-card{width:100%;max-width:440px}
    .user-mark{width:84px;height:84px;border-radius:50%;margin:0 auto 18px;background:#858989;border:5px solid #d4d6d5;display:flex;align-items:center;justify-content:center;color:white}
    .user-mark svg{width:43px;height:43px}
    .login-title{text-align:center;font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:34px;font-weight:400;margin:0 0 28px;color:#414547}
    .role-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border:1px solid #d8dada;background:#f1f2f1;margin-bottom:25px}
    .role-button{border:0;background:transparent;color:#626769;padding:11px 5px;font-size:13px;cursor:pointer}
    .role-button[aria-pressed="true"]{background:#fff;color:#202326;box-shadow:0 0 0 1px #c9cccc inset;font-weight:700}
    .field{margin:0 0 19px}
    .field label{display:block;font-size:13px;font-weight:600;margin:0 0 8px;color:#4b5052}
    .field input{width:100%;height:47px;border:0;border-bottom:1px solid #8f9393;background:transparent;padding:0 3px;font-size:15px;color:#202326;outline:none;border-radius:0}
    .field input:focus{border-bottom:2px solid #51595d}
    .field input::placeholder{color:#85898b}
    .form-options{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 26px;font-size:12px;color:#656a6c}
    .remember{display:flex;align-items:center;gap:7px}
    .remember input{accent-color:#777d7d}
    .form-options a,.help-link{color:#555b5d;text-decoration:underline;text-underline-offset:3px}
    .submit-button{height:58px;width:100%;border:0;background:var(--button);color:#fff;font-size:15px;letter-spacing:.02em;cursor:pointer;transition:background .15s ease}
    .submit-button:hover{background:#626868}
    .login-status{font-size:12px;line-height:1.55;color:#666d70;margin:17px 0 0;padding:10px 12px;border-left:2px solid #a8adad;background:rgba(239,240,239,.8)}
    .login-status.error{color:#5c4a3d;border-left-color:#a38a75}
    .security-note{text-align:center;color:#8a8e90;font-size:11px;margin:18px 0 0;line-height:1.5}
    .bottom-bar{height:46px;background:#858989;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 5vw;font-size:11px}
    .bottom-bar a{color:#fff}

    /* Improved contrast and a restrained blue login action */
    .brand-name{color:#111820}
    .brand-subtitle{color:#3f4b55}
    .field label{color:#30383e}
    .field input{color:#151a1e;border-bottom-color:#70777c}
    .field input::placeholder{color:#666d72}
    .form-options{color:#424a50}
    .form-options a,.help-link{color:#174f7c;font-weight:600}
    .role-button{color:#454d53}
    .role-button[aria-pressed="true"]{color:#123f6b;border-bottom:2px solid #246b9a}
    .submit-button{background:#245f8c;color:#fff;font-weight:600;box-shadow:0 2px 5px rgba(20,55,80,.16)}
    .submit-button:hover{background:#17466f}
    .submit-button:focus-visible{outline:3px solid #9ac7e8;outline-offset:3px}
    .submit-button:disabled{opacity:.7;cursor:wait}
    .login-status{color:#41494f}
    .login-status.error{color:#803d25;border-left-color:#b36b47;background:#faf3ee}
    .security-note{color:#626b72}
\n    @media(max-width:900px){.login-shell{grid-template-columns:1fr;background:#f6f6f5}.login-shell:before{inset:0;opacity:.28}.brand-panel{padding:32px 20px 18px}.brand-logo{width:72px;height:72px;margin-bottom:12px}.brand-name{font-size:24px}.brand-subtitle{font-size:10px;margin-top:8px}.brand-rule{margin-top:13px}.form-panel{min-height:auto;border-left:0;background:rgba(255,255,255,.86);padding:28px 22px 38px}.login-card{max-width:420px}.user-mark{width:66px;height:66px;margin-bottom:12px}.user-mark svg{width:34px;height:34px}.login-title{font-size:29px;margin-bottom:22px}}
    @media(max-width:480px){.bottom-bar{height:auto;min-height:46px;padding:12px 16px;flex-direction:column;justify-content:center;gap:6px;text-align:center}.form-options{font-size:11px}.role-button{font-size:12px}}
  </style>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="Firm identity">
      <div class="brand-inner">
        <img class="brand-logo" src="assets/images/CA%20Logo.png" alt="KMMC Chartered Accountants logo">
        <h1 class="brand-name">K MAHESH MANICKHAM &amp; CO.</h1>
        <p class="brand-subtitle">Chartered Accountants</p>
        <div class="brand-rule" aria-hidden="true"></div>
      </div>
    </section>
    <section class="form-panel" aria-label="Portal sign in">
      <div class="login-card">
        <div class="user-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="15" r="10"/><path d="M6 42c0-10 7-17 18-17s18 7 18 17v2H6z"/></svg>
        </div>
        <h2 class="login-title">Login</h2>
        <div class="role-picker" role="group" aria-label="Login as">
          <button class="role-button" type="button" data-role="customer" aria-pressed="true">Customer</button>
          <button class="role-button" type="button" data-role="employee" aria-pressed="false">Employee</button>
          <button class="role-button" type="button" data-role="admin" aria-pressed="false">Admin</button>
        </div>
        <form id="portalLoginForm">
          <div class="field" id="usernameField">
            <label for="portalUsername" id="usernameLabel">Customer ID / Email</label>
            <input id="portalUsername" name="username" autocomplete="username" placeholder="Enter user name" required>
          </div>
          <div class="field">
            <label for="portalPassword">Password</label>
            <input id="portalPassword" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
          </div>
          <input type="hidden" id="selectedRole" name="role" value="customer">
          <div class="form-options">
            <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
            <a href="contact.html">Need help?</a>
          </div>
          <button class="submit-button" type="submit" id="submitButton">Log In</button>
          <p class="login-status" id="portalLoginStatus" role="status" aria-live="polite">Enter your account details to continue.</p>
          <p class="security-note">Never share your password or one-time password with anyone.</p>
        </form>
      </div>
    </section>
  </main>
  <footer class="bottom-bar">
    <span>© <span id="year"></span> K Mahesh Manickham &amp; Co.</span>
    <a href="contact.html">Contact office</a>
  </footer>
  <script>
  (() => {
    const API_URL = 'https://script.google.com/macros/s/AKfycbxRTYJgXaJ2z16YfYdYxJCey7IuGqEQzEK6Oa8DuMAh5B31nWgVU4xrxzwGJ-ngzTzo/exec';
    const roleData = {
      customer: {apiRole:'CLIENT',label:'Customer ID / Email',placeholder:'Enter user name',button:'Log In'},
      employee: {apiRole:'EMPLOYEE',label:'Employee ID / Work email',placeholder:'Enter employee ID',button:'Log In'},
      admin: {apiRole:'ADMIN',label:'Admin password',placeholder:'Enter admin password',button:'Log In'}
    };
    const tabs=document.querySelectorAll('.role-button');
    const roleInput=document.getElementById('selectedRole');
    const usernameLabel=document.getElementById('usernameLabel');
    const username=document.getElementById('portalUsername');
    const password=document.getElementById('portalPassword');
    const submit=document.getElementById('submitButton');
    const status=document.getElementById('portalLoginStatus');
    const form=document.getElementById('portalLoginForm');
    function setStatus(message,error=false){status.textContent=message;status.classList.toggle('error',error);}
    function setRole(role){
      const data=roleData[role]||roleData.customer;
      roleInput.value=role;
      tabs.forEach(tab=>tab.setAttribute('aria-pressed',String(tab.dataset.role===role)));
      usernameLabel.textContent=data.label;username.placeholder=data.placeholder;submit.textContent=data.button;
      const isAdmin=role==='admin';document.getElementById('usernameField').hidden=isAdmin;username.required=!isAdmin;if(isAdmin)username.value='';
      setStatus('Enter your account details to continue.');
    }
    tabs.forEach(tab=>tab.addEventListener('click',()=>setRole(tab.dataset.role)));
    form.addEventListener('keydown',event=>{
      if(event.key==='Enter' && event.target.matches('input:not([type=checkbox])')){
        event.preventDefault();
        if(typeof form.requestSubmit==='function')form.requestSubmit(submit);else submit.click();
      }
    });
    form.addEventListener('submit',async event=>{
      event.preventDefault();if(!form.reportValidity())return;
      const role=roleInput.value,expected=roleData[role].apiRole,userName=username.value.trim(),userPassword=password.value;
      if((role!=='admin'&&!userName)||!userPassword){setStatus(role==='admin'?'Enter the Admin password.':'Enter your username and password.',true);return;}
      submit.disabled=true;submit.textContent='Signing in…';setStatus('Checking your credentials. Please wait.');
      try{
        const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'login',role:expected,username:userName,password:userPassword})});
        if(!response.ok)throw new Error('Authentication service returned HTTP '+response.status+'.');
        const result=await response.json();
        if(!result||result.ok!==true)throw new Error((result&&result.error)||'Login failed. Check your credentials.');
        let data=result;
        for(let i=0;i<4&&data&&typeof data==='object'&&!data.token;i++){
          if(data.data&&typeof data.data==='object')data=data.data;
          else if(data.result&&typeof data.result==='object')data=data.result;
          else break;
        }
        const user=data&&data.user;
        if(!data||!data.token||!user){
          const keys=data&&typeof data==='object'?Object.keys(data).join(', '):typeof data;
          throw new Error('Apps Script responded but did not return a session token. Response fields: '+(keys||'none')+'. Update and redeploy the latest backend Code.gs, then try again.');
        }
        if(String(user.role||'').toUpperCase()!==expected){
          try{await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'logout',token:data.token})});}catch(ignore){}
          throw new Error('This account is registered as '+String(user.role||'unknown')+'. Select the matching login type.');
        }
        localStorage.setItem('kmmc_session_token',data.token);
        localStorage.setItem('kmmc_session_expires_at',data.expiresAt||'');
        localStorage.setItem('kmmc_user',JSON.stringify(user));
        sessionStorage.setItem('kmmc_session_token',data.token);
        sessionStorage.setItem('kmmc_session_expires_at',data.expiresAt||'');
        sessionStorage.setItem('kmmc_user',JSON.stringify(user));
        password.value='';setStatus('Login successful. Opening your workspace…');window.location.href='portal.html';
      }catch(error){
        const message=String(error&&error.message||'Unable to sign in.');
        if(/Failed to fetch|NetworkError|Load failed/i.test(message)){
          setStatus('Could not reach Apps Script. Confirm the web app is deployed and accessible. If the browser reports CORS, the API needs a same-origin proxy.',true);
        }else setStatus(message,true);
      }finally{submit.disabled=false;submit.textContent=roleData[roleInput.value].button;}
    });
    document.getElementById('year').textContent=new Date().getFullYear();setRole('customer');
  })();
  </script>
</body>
</html>
