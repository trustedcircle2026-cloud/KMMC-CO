name: Deploy K Mahesh Manickham and Co. website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  # Do not cancel an active Pages deployment: cancelling mid-deployment can leave
  # GitHub Pages with a stale deployment marked as in progress.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      # The artifact upload can finish before the Actions artifacts API indexes it.
      # Poll the run's artifact list so deploy-pages never starts during that short delay.
      - name: Verify Pages artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/\$GITHUB_REPOSITORY/actions/runs/\$GITHUB_RUN_ID/artifacts" --jq '.artifacts[]? | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              echo "github-pages artifact is available."
              exit 0
            fi
            echo "Waiting for github-pages artifact to become available (attempt \$attempt/12)..."
            sleep 5
          done
          echo "::error::github-pages artifact was not visible after 60 seconds."
          gh api "repos/\$GITHUB_REPOSITORY/actions/runs/\$GITHUB_RUN_ID/artifacts" --jq '.artifacts[]? | {name, expired, id}' || true
          exit 1

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
