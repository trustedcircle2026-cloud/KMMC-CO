<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f4f3">
<title>KMMC Portal</title><link rel="icon" href="assets/images/CA%20Logo.png">
<style>
:root{--ink:#202326;--muted:#6d7276;--line:#d7d9d9;--paper:#fff;--soft:#f4f5f4;--button:#7b8080}
*{box-sizing:border-box}body{margin:0;background:#f4f5f4;color:var(--ink);font:14px Arial,Helvetica,sans-serif}
header{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px);gap:20px}
.brand{display:flex;align-items:center;gap:13px}.brand img{width:43px;height:43px;object-fit:contain}.brand strong{font-size:15px;letter-spacing:.02em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;margin-top:5px}
.actions{display:flex;align-items:center;gap:16px}.user-label{color:var(--muted);font-size:12px}.button{border:1px solid #c9cccc;background:#fff;padding:10px 16px;color:var(--ink);cursor:pointer}.button:hover{background:#eee}
main{max-width:1180px;margin:0 auto;padding:38px 24px 60px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}.welcome h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:32px;margin:8px 0}.welcome p{color:var(--muted);margin:0}.notice{background:#fff;border:1px solid var(--line);padding:14px 16px;color:var(--muted);margin-bottom:20px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}.stat,.panel{background:#fff;border:1px solid var(--line)}.stat{padding:19px 20px;min-height:105px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font-size:28px;font-weight:500;margin-top:12px}.workspace{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(270px,1fr);gap:18px}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.panel-head h2{font-size:15px;font-weight:600;margin:0}.panel-body{padding:18px 20px}.module-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.module{display:block;text-decoration:none;color:var(--ink);border:1px solid var(--line);padding:14px;background:#fff}.module:hover{background:#f7f7f6;border-color:#aeb2b2}.module strong{display:block;font-weight:600}.module small{display:block;color:var(--muted);margin-top:7px;line-height:1.4}.record-list{display:grid;gap:0}.record{padding:13px 0;border-bottom:1px solid #eceeed;display:flex;justify-content:space-between;gap:12px}.record:last-child{border-bottom:0}.record strong{font-weight:600}.record small{display:block;color:var(--muted);margin-top:5px}.empty{color:var(--muted);line-height:1.6}.status{font-size:12px;color:var(--muted);margin-top:15px;line-height:1.5}
@media(max-width:780px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:1fr}.welcome{align-items:start;flex-direction:column}.user-label{display:none}}
@media(max-width:480px){header{padding:0 14px}.brand strong{font-size:12px}.brand img{width:34px;height:34px}.brand small{font-size:9px}.actions{gap:8px}.button{padding:9px 11px}main{padding:25px 14px}.stats{gap:9px}.stat{padding:14px;min-height:90px}.stat strong{font-size:24px}.module-list{grid-template-columns:1fr}.welcome h1{font-size:28px}}
</style>
</head>
<body>
<header><div class="brand"><img src="assets/images/CA%20Logo.png" alt=""><div><strong>K MAHESH MANICKHAM &amp; CO.</strong><small>CHARTERED ACCOUNTANTS</small></div></div><div class="actions"><span class="user-label" id="userLabel">Signed in</span><button class="button" id="logoutButton" type="button">Log out</button></div></header>
<main>
<section class="welcome"><div><div class="eyebrow" id="roleEyebrow">KMMC SECURE PORTAL</div><h1 id="welcomeTitle">Your workspace</h1><p id="welcomeDescription">Your work and records in one place.</p></div></section>
<div id="notice" class="notice" role="status">Loading your workspace…</div>
<section class="stats" id="stats"></section>
<section class="workspace">
<div class="panel"><div class="panel-head"><h2>Workspace</h2></div><div class="panel-body"><div class="module-list" id="modules"></div></div></div>
<div class="panel"><div class="panel-head"><h2 id="recordsTitle">Recent records</h2><button class="button" id="refreshButton" type="button">Refresh</button></div><div class="panel-body"><div id="records" class="record-list"><p class="empty">Loading records…</p></div><p class="status" id="lastUpdated"></p></div></div>
</section>
</main>
<script>
(()=> {
 const API_URL='https://script.google.com/macros/s/AKfycbxRTYJgXaJ2z16YfYdYxJCey7IuGqEQzEK6Oa8DuMAh5B31nWgVU4xrxzwGJ-ngzTzo/exec';
 const token=sessionStorage.getItem('kmmc_session_token');
 let user=null;
 try{user=JSON.parse(sessionStorage.getItem('kmmc_user')||'null')}catch(e){}
 const notice=document.getElementById('notice'),stats=document.getElementById('stats'),modules=document.getElementById('modules'),records=document.getElementById('records');
 const roleTitles={ADMIN:'Administrator',EMPLOYEE:'Employee',CLIENT:'Customer'};
 const moduleInfo={
  clients:['Clients','Client master and contact records','users'],
  employees:['Employees','Employee master and access links','users'],
  tasks:['Tasks & work','Assigned work, priorities and due dates','tasks'],
  time:['Time records','Employee work time logs','time'],
  attendance:['Attendance','Check-in and check-out records','attendance'],
  leave:['Leave','Leave requests and status','leave'],
  documents:['Documents','Client and work-related files','documents'],
  invoices:['Invoices','Invoice register and billing records','invoices'],
  collections:['Collections','Receipts and collection tracking','collections'],
  expenses:['Expenses','Business expense records','expenses'],
  messages:['Messages','Portal communication','messages'],
  notifications:['Notifications','System and work notifications','notifications'],
  users:['User accounts','Login accounts and access roles','users'],
  activity:['Activity log','Recorded management actions','activity']
 };
 const allowed={
  ADMIN:['clients','employees','tasks','time','attendance','leave','documents','invoices','collections','expenses','messages','notifications','users','activity'],
  EMPLOYEE:['clients','tasks','time','attendance','leave','documents','invoices','collections','expenses','messages','notifications'],
  CLIENT:['tasks','documents','invoices','collections','messages','notifications']
 };
 async function api(action,extra={}){
  const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,...extra})});
  if(!response.ok)throw new Error('API returned HTTP '+response.status);
  const result=await response.json();if(!result||result.ok!==true)throw new Error(result&&result.error||'API request failed');
  return result.data;
 }
 function money(value){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(value)||0)}
 function renderModules(){
  modules.innerHTML=(allowed[user.role]||[]).map(k=>{const m=moduleInfo[k];return '<a class="module" href="#" data-module="'+k+'"><strong>'+m[0]+'</strong><small>'+m[1]+'</small></a>'}).join('');
  modules.querySelectorAll('[data-module]').forEach(el=>el.addEventListener('click',async e=>{e.preventDefault();await loadRecords(el.dataset.module)}));
 }
 function renderStats(data){
  const counts=data.counts||{},out=data.outstanding||{};
  const list=user.role==='ADMIN'?
   [['Clients',counts.clients],['Employees',counts.employees],['Open tasks',counts.tasks],['Outstanding',money(out.totalOutstanding)]]:
   user.role==='EMPLOYEE'?
   [['Assigned clients',counts.clients],['My tasks',counts.tasks],['Attendance entries',counts.attendance],['Time logs',counts.time]]:
   [['My tasks',counts.tasks],['Documents',counts.documents],['Invoices',counts.invoices],['Outstanding',money(out.totalOutstanding)]];
  stats.innerHTML=list.map(x=>'<div class="stat"><span>'+x[0]+'</span><strong>'+((x[1]===undefined||x[1]===null)?'—':x[1])+'</strong></div>').join('');
 }
 async function loadRecords(module){
  document.getElementById('recordsTitle').textContent=moduleInfo[module]?.[0]||'Records';
  records.innerHTML='<p class="empty">Loading records…</p>';
  try{
   const result=await api('list',{module,limit:30,offset:0});
   const items=result.records||[];
   if(!items.length){records.innerHTML='<p class="empty">No records are available to display.</p>'}
   else records.innerHTML=items.slice(0,15).map(r=>{
    const title=r.name||r.title||r.invoiceNo||r.receiptNo||r.clientCode||r.employeeCode||r.id||'Record';
    const sub=[r.status,r.dueDate||r.invoiceDate||r.workDate||r.collectionDate].filter(Boolean).join(' · ');
    const amount=r.totalAmount!==undefined?money(r.totalAmount):r.amount!==undefined?money(r.amount):'';
    return '<div class="record"><div><strong>'+esc(title)+'</strong><small>'+esc(sub||moduleInfo[module]?.[1]||'Record')+'</small></div><strong>'+esc(amount)+'</strong></div>';
   }).join('');
   document.getElementById('lastUpdated').textContent='Showing '+Math.min(items.length,15)+' of '+result.total+' record(s).';
  }catch(e){records.innerHTML='<p class="empty">'+esc(e.message)+'</p>'}
 }
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 async function start(){
  if(!token||!user){window.location.replace('login.html');return}
  document.getElementById('userLabel').textContent=(user.name||user.username)+' · '+(roleTitles[user.role]||user.role);
  document.getElementById('welcomeTitle').textContent='Welcome, '+(user.name||user.username);
  document.getElementById('welcomeDescription').textContent='Your '+(roleTitles[user.role]||'KMMC')+' workspace.';
  document.getElementById('roleEyebrow').textContent=(roleTitles[user.role]||'KMMC').toUpperCase()+' PORTAL';
  renderModules();
  try{
   const data=await api('dashboard');renderStats(data);
   notice.textContent='You are signed in. The information below is loaded from the KMMC backend.';
   const first=(allowed[user.role]||[]).find(k=>['tasks','invoices','clients'].includes(k))||(allowed[user.role]||[])[0];
   if(first)await loadRecords(first);else records.innerHTML='<p class="empty">No modules are available for this account.</p>';
  }catch(e){
   if(/Session expired|Login required|Account inactive/i.test(e.message)){sessionStorage.clear();window.location.replace('login.html');return}
   notice.textContent='Could not load portal data: '+e.message+' Check that the Apps Script deployment is available to this website.';
   notice.style.borderLeft='3px solid #a38a75';stats.innerHTML='';records.innerHTML='<p class="empty">Data could not be loaded.</p>';
  }
 }
 document.getElementById('refreshButton').addEventListener('click',()=>start());
 document.getElementById('logoutButton').addEventListener('click',async()=>{
  try{if(token)await api('logout')}catch(e){}
  sessionStorage.removeItem('kmmc_session_token');sessionStorage.removeItem('kmmc_session_expires_at');sessionStorage.removeItem('kmmc_user');
  window.location.replace('login.html');
 });
 start();
})();
</script>
</body></html>
